<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quadro Kanban</title>
  <link rel="icon" href="imagens/checklist.png" type="image/png">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js">
  <link rel="stylesheet" href="css/index.css">
</head>
<body>
  <div class="kanban-container">
    <div class="header-container">
      <h1 class="title-quadro"><i class="fas fa-tasks"></i> Quadro Kanban</h1>
      <div class="action-buttons">
        <button id="print-screen" class="action-btn" title="Capturar tela">
          <i class="fas fa-camera"></i> Capturar
        </button>
        <button id="export-excel" class="action-btn" title="Exportar para Excel">
          <i class="fas fa-file-excel"></i> Exportar
        </button>
        <button id="show-timeline" class="action-btn" title="Linha do tempo">
          <i class="fas fa-project-diagram"></i> Linha do Tempo
        </button>
      </div>
    </div>

    <div class="kanban-board" id="kanban-board-print">
      <!-- Coluna Pendente -->
      <div class="kanban-column" id="pending">
        <div class="title-container">
          <h2 class="column-title"><i class="fas fa-clock"></i> Pendente</h2>
          <i class="fas fa-plus add-icon" id="open-modal"></i>
        </div>
        <ul class="task-list" id="pending-tasks"></ul>
      </div>

      <!-- Modal -->
      <div class="modal" id="task-modal">
        <div class="modal-content">
          <span class="close-modal" id="close-modal">&times;</span>
          <form id="task-form">
            <h2 class="title-modal">Adicionar Tarefa</h2>
            <div class="container-input">
              <input type="text" id="task-input" placeholder="Nome da tarefa..." required>
              <input type="date" id="task-date" required>
            </div>
            <textarea id="task-observation" placeholder="Adicione uma observação..." rows="2"></textarea>
            
            <button type="submit">Adicionar</button>
          </form>
        </div>
      </div>

      <!-- Coluna Em Andamento -->
      <div class="kanban-column" id="in-progress">
        <div class="title-container">
          <h2 class="column-title"><i class="fas fa-spinner"></i> Em Andamento</h2>
        </div>
        <ul class="task-list" id="in-progress-tasks"></ul>
      </div>

      <!-- Coluna Concluído -->
      <div class="kanban-column" id="completed">
        <div class="title-container">
          <h2 class="column-title"><i class="fas fa-check-circle"></i> Concluído</h2>
        </div>
        <ul class="task-list" id="completed-tasks"></ul>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="js/index.js"></script>
</body>
</html>
