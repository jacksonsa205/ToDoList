<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quadro Kanban</title>
  <link rel="icon" href="imagens/checklist.png" type="image/png">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js">
  <link rel="stylesheet" href="css/index.css">
</head>
<body>
  <div class="kanban-container">
    <div class="header-container">
      <h1 class="title-quadro"><i class="fas fa-tasks"></i> Quadro Kanban</h1>
      <div class="action-buttons">
        <button id="print-screen" class="action-btn" title="Capturar tela">
          <i class="fas fa-camera"></i> Capturar
        </button>
        <button id="export-excel" class="action-btn" title="Exportar para Excel">
          <i class="fas fa-file-excel"></i> Exportar
        </button>
        <button id="show-timeline" class="action-btn" title="Linha do tempo">
          <i class="fas fa-project-diagram"></i> Linha do Tempo
        </button>
      </div>
    </div>

    <div class="kanban-board" id="kanban-board-print">
      <!-- Coluna Pendente -->
      <div class="kanban-column" id="pending">
        <div class="title-container">
          <h2 class="column-title"><i class="fas fa-clock"></i> Pendente</h2>
          <i class="fas fa-plus add-icon" id="open-modal"></i>
        </div>
        <ul class="task-list" id="pending-tasks"></ul>
      </div>

      <!-- Modal -->
      <div class="modal" id="task-modal">
        <div class="modal-content">
          <span class="close-modal" id="close-modal">&times;</span>
          <form id="task-form">
            <h2 class="title-modal">Adicionar Tarefa</h2>
            
            <div class="form-group">
              <label for="task-input">Nome da Tarefa*</label>
              <input type="text" id="task-input" placeholder="Digite o nome da tarefa..." required>
            </div>
            
            <div class="form-row">
              <div class="form-group">
                <label for="task-date">Data de Conclusão*</label>
                <input type="date" id="task-date" required>
              </div>
              
              <div class="form-group">
                <label for="task-responsible">Responsável</label>
                <select id="task-responsible">
                  <option value="">Selecione...</option>
                  <option value="JACKSON ALVES DE SA">JACKSON ALVES DE SA</option>
                  <option value="EDUARDO CESAR PEREIRA FILHO">EDUARDO CESAR PEREIRA FILHO</option>
                  <option value="ELISAMANDA PEREIRA DE SOUZA">ELISAMANDA PEREIRA DE SOUZA</option>
                  <option value="MARCIA APARECIDA MIRANDA SANTOS">MARCIA APARECIDA MIRANDA SANTOS</option>
                  <option value="MARIA CARVALHO LOPES MINGARELLI">MARIA CARVALHO LOPES MINGARELLI</option>
                  <option value="RODRIGO FERNANDO BARBOSA">RODRIGO FERNANDO BARBOSA</option>
                  <option value="VITOR RODRIGO CORREIA ARAUJO">VITOR RODRIGO CORREIA ARAUJO</option>
                  <option value="YARA KEZIAN DA SILVA DIAS">YARA KEZIAN DA SILVA DIAS</option>
                </select>
              </div>
            </div>
            
            <div class="form-group">
              <label for="task-priority">Prioridade</label>
              <select id="task-priority">
                <option value="low">Baixa</option>
                <option value="medium" selected>Média</option>
                <option value="high">Alta</option>
                <option value="urgent">Urgente</option>
              </select>
            </div>
            
            <div class="form-group">
              <label>Tags</label>
              <div class="tags-container" id="tags-container">
                <!-- Tags serão adicionadas dinamicamente -->
              </div>
              <div class="tags-input-container">
                <input type="text" id="task-tags-input" placeholder="Digite tags separadas por vírgula...">
                <button type="button" id="add-tags-btn" class="small-btn">Adicionar</button>
              </div>
            </div>
            
            <div class="form-group">
              <label for="task-observation">Observações</label>
              <textarea id="task-observation" placeholder="Adicione observações importantes..." rows="3"></textarea>
            </div>
            
            <div class="form-group">
              <label>Anexos</label>
              <div class="attachments-container" id="attachments-container">
                <p class="no-attachments">Nenhum arquivo anexado</p>
              </div>
              <div class="file-upload-container">
                <label for="task-file-upload" class="file-upload-btn">
                  <i class="fas fa-paperclip"></i> Anexar Arquivo
                </label>
                <input type="file" id="task-file-upload" multiple style="display: none;">
              </div>
            </div>
            
            <div class="form-actions">
              <button type="button" id="cancel-task-btn" class="secondary-btn">Cancelar</button>
              <button type="submit" id="save-task-btn">Salvar Tarefa</button>
            </div>
          </form>
        </div>
      </div>

      <!-- Coluna Em Andamento -->
      <div class="kanban-column" id="in-progress">
        <div class="title-container">
          <h2 class="column-title"><i class="fas fa-spinner"></i> Em Andamento</h2>
        </div>
        <ul class="task-list" id="in-progress-tasks"></ul>
      </div>

      <!-- Coluna Concluído -->
      <div class="kanban-column" id="completed">
        <div class="title-container">
          <h2 class="column-title"><i class="fas fa-check-circle"></i> Concluído</h2>
        </div>
        <ul class="task-list" id="completed-tasks"></ul>
      </div>
    </div>
  </div>

  <!-- Modal de Detalhes da Tarefa -->
  <div class="modal" id="detail-modal">
    <div class="modal-content">
      <span class="close-modal" id="close-detail-modal">&times;</span>
      <div class="task-detail-content" id="task-detail-content">
        <!-- Conteúdo será preenchido dinamicamente -->
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="js/index.js"></script>
</body>
</html>
