<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Linha do Tempo - Kanban</title>
  <link rel="icon" href="imagens/checklist.png" type="image/png">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/timeline.css">
</head>
<body>
  <div class="timeline-container">
    <div class="header-container">
      <h1 class="title-timeline"><i class="fas fa-project-diagram"></i> Linha do Tempo</h1>
      <div class="action-buttons">
        <button id="back-to-kanban" class="action-btn" title="Voltar ao Kanban">
          <i class="fas fa-arrow-left"></i> Voltar
        </button>
      </div>
    </div>

    <div class="timeline-content">
      <div class="timeline-filters">
        <div class="filter-group">
          <label for="start-date">De:</label>
          <input type="date" id="start-date">
        </div>
        <div class="filter-group">
          <label for="end-date">Até:</label>
          <input type="date" id="end-date">
        </div>
        <button id="apply-filters" class="filter-btn">Aplicar Filtros</button>
      </div>

      <div class="timeline-stats">
        <div class="stat-card pending">
          <h3><i class="fas fa-clock"></i> Pendentes</h3>
          <span id="pending-count">0</span>
        </div>
        <div class="stat-card in-progress">
          <h3><i class="fas fa-spinner"></i> Em Andamento</h3>
          <span id="in-progress-count">0</span>
        </div>
        <div class="stat-card completed">
          <h3><i class="fas fa-check-circle"></i> Concluídas</h3>
          <span id="completed-count">0</span>
        </div>
      </div>

      <!-- Timeline Visual -->
      <div class="timeline-visual-container">
        <h2 class="timeline-title">Progresso por Data</h2>
        <div class="timeline-visual">
          <div class="timeline-line"></div>
          <div id="timeline-points" class="timeline-points-container">
            <!-- Pontos serão inseridos via JavaScript -->
          </div>
        </div>
      </div>

      <div class="timeline-table-container">
        <div class="timeline-table">
          <table>
            <thead>
              <tr>
                <th>Data</th>
                <th>Pendentes</th>
                <th>Em Andamento</th>
                <th>Concluídas</th>
                <th>Total</th>
              </tr>
            </thead>
            <tbody id="timeline-data">
              <!-- Dados serão inseridos via JavaScript -->
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script src="js/timeline.js"></script>
</body>
</html>
